<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pialletto d'Oro">
<meta name="theme-color" content="#FAF8F5">
<link rel="apple-touch-icon" href="./logo.png">
<title>Preventivatore Laboratorio</title>
<link rel="stylesheet" href="./stile.css">
</head>
<body>

<header>
  <div class="logo"><img src="./logo.png" alt="Pialletto d'Oro" onerror="this.parentNode.hidden=true;this.parentNode.nextElementSibling.hidden=false"></div>
  <div class="marca" hidden>Pialletto d'Oro</div>
  <h1>Preventivatore Laboratorio</h1>
</header>

<nav class="nav" aria-label="Sezioni">
  <a href="./index.html">Uscite</a>
  <a href="./laboratorio.html" class="on" aria-current="page">Laboratorio</a>
</nav>

<section>
  <div id="stato">Pronto.</div>
  <div class="crono" id="crono">00:00:00</div>
  <button id="bAvvia">AVVIA LAVORO</button>
  <button class="b2" id="bPausa" disabled>PAUSA / FERMA</button>
  <div class="rapidi">
    <button type="button" data-min="15">+15 min</button>
    <button type="button" data-min="30">+30 min</button>
    <button type="button" data-min="60">+1 ora</button>
    <button type="button" data-min="-15">−15 min</button>
  </div>
</section>

<section>
  <div class="chk"><input type="checkbox" id="conOp"><label for="conOp">Con aiuto operaio</label></div>

  <h2>Materiali e macchinari</h2>
  <label for="mat" style="margin-top:0">Costo legno / materiale (€)</label>
  <input type="number" id="mat" value="0" min="0" step="0.01" inputmode="decimal">
  <div class="chk" style="margin-top:10px"><input type="checkbox" id="mac"><label for="mac">Avviamento macchinari / Consumo</label></div>

  <label for="desc">Descrizione lavoro (facoltativa)</label>
  <input type="text" id="desc" placeholder="es. Taglio mensola rovere">

  <details>
    <summary>Impostazioni tariffe</summary>
    <div class="row due">
      <div><label for="tOra">€/ora tuo lavoro</label><input type="number" id="tOra" value="40" min="0" inputmode="decimal"></div>
      <div><label for="tOp">€/ora operaio</label><input type="number" id="tOp" value="30" min="0" inputmode="decimal"></div>
      <div><label for="tLab">€/ora uso laboratorio</label><input type="number" id="tLab" value="15" min="0" inputmode="decimal"></div>
      <div><label for="tForf">Forfait avviamento macchinari €</label><input type="number" id="tForf" value="10" min="0" inputmode="decimal"></div>
      <div><label for="tMin">Minimo intervento €</label><input type="number" id="tMin" value="15" min="0" inputmode="decimal"></div>
    </div>
  </details>
</section>

<section id="ivaBox">
  <div class="chk"><input type="checkbox" id="conIva"><label for="conIva">Aggiungi IVA (22%)</label></div>
</section>

<section id="res">
  <div class="note" style="margin:0">Da chiedere al cliente</div>
  <div class="tot"><span id="tot">0,00 €</span> <span class="suf" id="totSuf">+ IVA</span></div>
  <div id="totSub"></div>
  <table id="dett"></table>
</section>

<section id="invia">
  <h2>Invia al cliente</h2>
  <input type="tel" id="tel" inputmode="tel" autocomplete="off" placeholder="Cellulare cliente (es. 333 1234567)" aria-label="Cellulare cliente">
  <button class="wa" id="bWa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5.1A8.5 8.5 0 1 1 21 11.5z"/><path d="M9 8.5c0 3.5 3 6.500 6.500 6.500l1-1.800-2-1-1 .8c-1-.5-1.800-1.300-2.300-2.300l.8-1-1-2z" stroke-width="1.4"/></svg>Invia riepilogo su WhatsApp</button>
</section>

<button class="ghost" id="bNuovo">Nuova lavorazione</button>

<script>
const $ = id => document.getElementById(id);

// barra Uscite / Laboratorio: resta dentro la Web App a schermo intero
document.querySelectorAll('.nav a').forEach(a => {
  a.onclick = e => { e.preventDefault(); window.location.href = a.href; };
});

// ---- tariffe (salvate a parte: restano tra una lavorazione e l'altra) ----
const DEF = { tOra: 40, tOp: 30, tLab: 15, tForf: 10, tMin: 15 };
let T = Object.assign({}, DEF);
try { T = Object.assign(T, JSON.parse(localStorage.getItem('tarLab') || 'null') || {}); } catch (e) {}
Object.keys(DEF).forEach(id => {
  $(id).value = T[id];
  $(id).oninput = () => {
    const v = parseFloat($(id).value);
    T[id] = isNaN(v) || v < 0 ? DEF[id] : v;
    try { localStorage.setItem('tarLab', JSON.stringify(T)); } catch (e) {}
    mostra();
  };
});

// ---- lavorazione in corso ----
const VUOTA = () => ({ ms: 0, start: null, conOp: false, mat: '0', mac: false, desc: '', tel: '', iva: false });
let L = VUOTA();
try { L = Object.assign(L, JSON.parse(localStorage.getItem('lab') || 'null') || {}); } catch (e) {}
function salva() { try { localStorage.setItem('lab', JSON.stringify(L)); } catch (e) {} }

const eur = n => n.toFixed(2).replace('.', ',') + ' €';
const due = n => String(n).padStart(2, '0');
const trascorso = () => L.ms + (L.start ? Date.now() - L.start : 0);   // millisecondi di lavoro
const orologio = ms => { const s = Math.floor(ms / 1000); return due(Math.floor(s / 3600)) + ':' + due(Math.floor(s / 60) % 60) + ':' + due(s % 60); };
const fmt = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };

// ---- calcolo ----
function calcola() {
  const ms = trascorso();
  const ore = ms / 3600000;                       // tempo effettivo, senza arrotondamenti
  const cL = ore * T.tOra;                        // manodopera tua
  const cO = L.conOp ? ore * T.tOp : 0;           // operaio
  const cM = L.mac ? T.tForf : 0;                 // forfait avviamento macchinari
  const cLab = ore * T.tLab;                      // uso laboratorio (affitto, corrente, affilatura, usura)
  let lavoro = cL + cO + cLab + cM;
  const minimo = lavoro > 0 && lavoro < T.tMin;   // soglia minima sul lavoro (materiale escluso)
  if (minimo) lavoro = T.tMin;
  const mat = Math.max(0, parseFloat(L.mat) || 0);
  const netto = lavoro + mat;
  return { ms, cL, cO, cLab, cM, minimo, mat, netto, ivaE: netto * 0.22 };
}

let R = calcola();

function mostra() {
  R = calcola();
  $('crono').textContent = orologio(R.ms);
  $('stato').textContent = L.start ? 'Lavoro in corso...' : (R.ms > 0 ? 'In pausa.' : 'Pronto.');
  $('bAvvia').disabled = !!L.start;
  $('bPausa').disabled = !L.start;

  $('tot').textContent = eur(L.iva ? R.netto + R.ivaE : R.netto);
  $('totSuf').textContent = L.iva ? 'IVA inclusa' : '+ IVA';
  $('totSub').textContent = L.iva ? 'Imponibile ' + eur(R.netto) + ' + IVA 22% ' + eur(R.ivaE) : '';

  const t = $('dett');
  t.innerHTML = '';
  const riga = (a, b) => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td');
    const td2 = document.createElement('td');
    td1.textContent = a; td2.textContent = b;
    tr.appendChild(td1); tr.appendChild(td2);
    t.appendChild(tr);
  };
  riga('Tempo di lavoro', fmt(R.ms));
  riga('Manodopera tua', eur(R.cL));
  if (L.conOp) riga('Operaio', eur(R.cO));
  if (T.tLab > 0) riga('Uso laboratorio', eur(R.cLab));
  if (L.mac) riga('Avviamento macchinari', eur(R.cM));
  if (R.minimo) riga('Minimo intervento applicato', eur(T.tMin));
  if (R.mat > 0) riga('Materiale', eur(R.mat));
}

// ---- cronometro ----
$('bAvvia').onclick = () => { if (!L.start) L.start = Date.now(); salva(); mostra(); };
$('bPausa').onclick = () => { if (L.start) { L.ms += Date.now() - L.start; L.start = null; } salva(); mostra(); };
document.querySelectorAll('.rapidi button').forEach(b => {
  b.onclick = () => {
    const tot = Math.max(0, trascorso() + (+b.dataset.min) * 60000);
    L.ms = tot;
    if (L.start) L.start = Date.now();
    salva(); mostra();
  };
});
setInterval(() => { if (L.start) mostra(); }, 1000);

// ---- campi ----
$('conOp').onchange = () => { L.conOp = $('conOp').checked; salva(); mostra(); };
$('mac').onchange = () => { L.mac = $('mac').checked; salva(); mostra(); };
$('mat').oninput = () => { L.mat = $('mat').value; salva(); mostra(); };
$('desc').oninput = () => { L.desc = $('desc').value; salva(); };
$('tel').oninput = () => { L.tel = $('tel').value; salva(); };
$('conIva').onchange = () => { L.iva = $('conIva').checked; salva(); mostra(); };

// numero per WhatsApp: solo cifre, prefisso 39 se e' un numero italiano di 9-10 cifre
function numWa(v) {
  let n = (v || '').replace(/\D/g, '');
  if (n.startsWith('00')) n = n.slice(2);
  if (n.length >= 9 && n.length <= 10) n = '39' + n;
  return n;
}

$('bWa').onclick = () => {
  mostra();
  const importo = L.iva ? eur(R.netto + R.ivaE) + ' (IVA 22% inclusa)' : eur(R.netto) + ' + IVA';
  const righe = [
    "*Pialletto d'Oro - Riepilogo Lavorazione*",
    '',
    'Data: ' + new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' })
  ];
  const desc = $('desc').value.trim();
  if (desc) righe.push('Lavoro: ' + desc);
  righe.push('Importo totale: *' + importo + '*', '', 'Grazie per averci scelto.');
  const n = numWa($('tel').value);
  location.href = 'https://wa.me/' + n + '?text=' + encodeURIComponent(righe.join('\n'));
};

// "Nuova lavorazione" con conferma: il primo tocco chiede conferma, il secondo (entro 4 secondi) azzera
let confT = 0;
function confFine() { confT = 0; $('bNuovo').textContent = 'Nuova lavorazione'; $('bNuovo').classList.remove('conf'); }
$('bNuovo').onclick = () => {
  if (!confT) {
    $('bNuovo').textContent = 'Tocca di nuovo per azzerare';
    $('bNuovo').classList.add('conf');
    confT = setTimeout(confFine, 4000);
    return;
  }
  clearTimeout(confT);
  confFine();
  const iva = L.iva;            // l'IVA resta come l'avevi impostata
  L = VUOTA();
  L.iva = iva;
  salva();
  campi();
  mostra();
};

function campi() {
  $('conOp').checked = !!L.conOp;
  $('mac').checked = !!L.mac;
  $('mat').value = L.mat;
  $('desc').value = L.desc || '';
  $('tel').value = L.tel || '';
  $('conIva').checked = !!L.iva;
}

campi();
mostra();
</script>
</body>
</html>
