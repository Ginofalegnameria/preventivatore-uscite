<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pialletto d'Oro">
<meta name="theme-color" content="#FAF8F5">
<link rel="apple-touch-icon" href="./logo.png">
<link rel="manifest" href="./manifest.json">
<title>Preventivatore Uscite</title>
<link rel="stylesheet" href="./stile.css">
</head>
<body>

<header>
  <div class="logo"><img src="./logo.png" alt="Pialletto d'Oro" onerror="this.parentNode.hidden=true;this.parentNode.nextElementSibling.hidden=false"></div>
  <div class="marca" hidden>Pialletto d'Oro</div>
  <h1>Preventivatore Uscite</h1>
</header>

<nav class="nav" aria-label="Sezioni">
  <a href="./index.html" class="on" aria-current="page">Uscite</a>
  <a href="./laboratorio.html">Laboratorio</a>
</nav>

<section>
  <div id="stato">Pronto.</div>
  <button id="bParti">1. PARTO</button>
  <button class="b2" id="bArrivo" disabled>2. SONO ARRIVATO</button>
  <button class="b3" id="bFine" disabled>3. HO FINITO</button>
  <div class="note" id="live"></div>
</section>

<section>
  <div class="chk"><input type="checkbox" id="conOp"><label for="conOp">Vado con un operaio</label></div>
  <div class="passo" id="opRow" hidden>
    <span>Numero operai</span>
    <button type="button" class="step" id="bOpMeno" aria-label="Un operaio in meno">−</button>
    <span class="num" id="nOp">1</span>
    <button type="button" class="step" id="bOpPiu" aria-label="Un operaio in più">+</button>
  </div>
  <label for="cliente">Cliente</label>
  <input type="text" id="cliente" placeholder="Nome cliente">

  <details>
    <summary>Inserisci km a mano se il GPS non prende</summary>
    <label for="kmMan">Km di sola andata (solo se il GPS non funziona)</label>
    <input type="number" id="kmMan" step="0.1" placeholder="es. 12" inputmode="decimal">
  </details>

  <details>
    <summary>Impostazioni tariffe</summary>
    <div class="row">
      <div><label for="tKm">€ al km</label><input type="number" id="tKm" value="1" step="0.1" inputmode="decimal"></div>
      <div><label for="tOra">€/ora tu</label><input type="number" id="tOra" value="40" inputmode="decimal"></div>
      <div><label for="tOp">€/ora operaio</label><input type="number" id="tOp" value="30" inputmode="decimal"></div>
    </div>
  </details>
</section>

<section id="ivaBox" hidden>
  <div class="chk"><input type="checkbox" id="conIva"><label for="conIva">Aggiungi IVA (22%)</label></div>
</section>

<section id="res" hidden>
  <div class="note" style="margin:0">Da chiedere al cliente</div>
  <div class="tot"><span id="tot">0 €</span> <span class="suf" id="totSuf"></span></div>
  <div id="totSub"></div>
  <table id="dett"></table>
</section>

<section id="invia" hidden>
  <h2>Invia al cliente</h2>
  <input type="tel" id="tel" inputmode="tel" autocomplete="off" placeholder="Cellulare cliente (es. 333 1234567)" aria-label="Cellulare cliente">
  <button class="wa" id="bWa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5.1A8.5 8.5 0 1 1 21 11.5z"/><path d="M9 8.5c0 3.5 3 6.500 6.500 6.500l1-1.800-2-1-1 .8c-1-.5-1.800-1.300-2.300-2.300l.8-1-1-2z" stroke-width="1.4"/></svg>Invia riepilogo su WhatsApp</button>
</section>

<button class="ghost" id="bNuovo" hidden>Nuovo intervento</button>

<script>
const $ = id => document.getElementById(id);

// barra Uscite / Laboratorio: resta dentro la Web App a schermo intero
document.querySelectorAll('.nav a').forEach(a => {
  a.onclick = e => { e.preventDefault(); window.location.href = a.href; };
});

let S = { fase: 0 };
try { S = JSON.parse(localStorage.getItem('prev') || 'null') || { fase: 0 }; } catch (e) {}
function salva() { try { localStorage.setItem('prev', JSON.stringify(S)); } catch (e) {} }

function dist(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dl = r(b.lat - a.lat), dn = r(b.lon - a.lon);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dn / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function pos() {
  return new Promise(ok => {
    if (!navigator.geolocation) { ok(null); return; }
    try {
      navigator.geolocation.getCurrentPosition(
        p => ok({ lat: p.coords.latitude, lon: p.coords.longitude }),
        () => ok(null),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    } catch (e) { ok(null); }
  });
}

const fmt = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
const eur = n => n.toFixed(2).replace('.', ',') + ' €';

function ui() {
  $('bParti').disabled = S.fase !== 0;
  $('bArrivo').disabled = S.fase !== 1;
  $('bFine').disabled = S.fase !== 2;
  $('stato').textContent = ['Pronto.', 'In viaggio...', 'Al lavoro...', 'Finito.'][S.fase];
  if (S.fase === 3) mostra();
}

$('bParti').onclick = async () => {
  $('stato').textContent = 'Rilevo posizione...';
  S.p0 = await pos();
  S.t0 = Date.now();
  S.fase = 1;
  salva(); ui();
  $('live').textContent = S.p0 ? 'Posizione di partenza rilevata.' : 'GPS non disponibile: scrivi i km di sola andata.';
};

$('bArrivo').onclick = async () => {
  $('stato').textContent = 'Rilevo posizione...';
  S.p1 = await pos();
  S.t1 = Date.now();
  S.fase = 2;
  salva(); ui();
  $('live').textContent = S.p1 ? 'Posizione di arrivo rilevata.' : 'GPS non disponibile: scrivi i km di sola andata.';
};

$('bFine').onclick = () => {
  S.t2 = Date.now();
  S.fase = 3;
  S.tKm = +$('tKm').value;
  S.tOra = +$('tOra').value;
  S.tOp = +$('tOp').value;
  S.conOp = $('conOp').checked;
  S.nOp = nOp;
  S.cliente = $('cliente').value;
  S.kmMan = parseFloat($('kmMan').value);
  S.iva = $('conIva').checked;
  salva(); ui();
};

// "Nuovo intervento" con conferma: il primo tocco chiede conferma, il secondo (entro 4 secondi) azzera
let confT = 0;
function confFine() { confT = 0; $('bNuovo').textContent = 'Nuovo intervento'; $('bNuovo').classList.remove('conf'); }
$('bNuovo').onclick = () => {
  if (!confT) {
    $('bNuovo').textContent = 'Tocca di nuovo per azzerare';
    $('bNuovo').classList.add('conf');
    confT = setTimeout(confFine, 4000);
    return;
  }
  clearTimeout(confT);
  confFine();
  S = { fase: 0 };
  salva();
  $('res').hidden = true;
  $('ivaBox').hidden = true;
  $('invia').hidden = true;
  $('bNuovo').hidden = true;
  $('tel').value = '';
  $('cliente').value = '';
  $('live').textContent = '';
  $('kmMan').value = '';
  $('conOp').checked = false;
  nOp = 1;
  opUi();
  ui();
};

// numero operai: tasti + e - (da 1 a 9), visibili solo con "Vado con un operaio"
let nOp = S.nOp || 1;
function opUi() {
  $('opRow').hidden = !$('conOp').checked;
  $('nOp').textContent = nOp;
  $('bOpMeno').disabled = nOp <= 1;
  $('bOpPiu').disabled = nOp >= 9;
}
$('conOp').onchange = opUi;
$('bOpMeno').onclick = () => { if (nOp > 1) nOp--; opUi(); };
$('bOpPiu').onclick = () => { if (nOp < 9) nOp++; opUi(); };

// IVA: ricalcola il totale mostrato
$('conIva').onchange = () => {
  if (S.fase === 3) { S.iva = $('conIva').checked; salva(); mostra(); }
};

// telefono cliente: resta salvato finche' non premi "Nuovo intervento"
$('tel').oninput = () => { S.tel = $('tel').value; salva(); };

// numero per WhatsApp: solo cifre, prefisso 39 se e' un numero italiano di 9-10 cifre
function numWa(v) {
  let n = (v || '').replace(/\D/g, '');
  if (n.startsWith('00')) n = n.slice(2);
  if (n.length >= 9 && n.length <= 10) n = '39' + n;
  return n;
}

let R = null; // dati dell'ultimo riepilogo mostrato

$('bWa').onclick = () => {
  if (!R) return;
  const importo = R.iva ? eur(R.netto + R.ivaE) + ' (IVA 22% inclusa)' : eur(R.netto) + ' + IVA';
  const righe = [
    "*Pialletto d'Oro - Riepilogo Intervento*",
    '',
    'Data: ' + new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }),
    'Importo totale: *' + importo + '*',
    '',
    'Grazie per averci scelto.'
  ];
  const n = numWa($('tel').value);
  location.href = 'https://wa.me/' + n + '?text=' + encodeURIComponent(righe.join('\n'));
};

function mostra() {
  let kmUno = 0, fonte = 'mancanti';
  if (S.kmMan > 0) { kmUno = S.kmMan; fonte = 'inseriti da te'; }
  else if (S.p0 && S.p1) { kmUno = dist(S.p0, S.p1) * 1.25; fonte = 'stimati dal GPS'; }

  const km = kmUno * 2;                                   // andata e ritorno
  const ore = (S.t2 - S.t1) / 3600000;                    // tempo al lavoro
  const oreC = Math.max(0.25, Math.ceil(ore * 4) / 4);    // arrotondato al quarto d'ora
  const cKm = km * S.tKm;
  const cL = oreC * S.tOra;
  const quanti = S.conOp ? (S.nOp || 1) : 0;              // numero operai
  const cO = oreC * S.tOp * quanti;

  const netto = cKm + cL + cO;
  const iva = !!S.iva;
  const ivaE = netto * 0.22;
  $('conIva').checked = iva;
  $('tot').textContent = eur(iva ? netto + ivaE : netto);
  $('totSuf').textContent = iva ? 'IVA inclusa' : '+ IVA';
  $('totSub').textContent = iva ? 'Imponibile ' + eur(netto) + ' + IVA 22% ' + eur(ivaE) : '';
  R = { netto, iva, ivaE };

  const t = $('dett');
  t.innerHTML = '';
  const riga = (a, b) => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td');
    const td2 = document.createElement('td');
    td1.textContent = a; td2.textContent = b;
    tr.appendChild(td1); tr.appendChild(td2);
    t.appendChild(tr);
  };
  if (S.cliente) riga('Cliente', S.cliente);
  riga('Km andata+ritorno (' + fonte + ')', km.toFixed(1) + ' km · ' + eur(cKm));
  riga('Tempo al lavoro', fmt(S.t2 - S.t1) + ' (conteggiate ' + oreC.toFixed(2) + ' h)');
  riga('Manodopera tua', eur(cL));
  if (S.conOp) riga(quanti > 1 ? 'Operai (' + quanti + ')' : 'Operaio', eur(cO));
  $('res').hidden = false;
  $('ivaBox').hidden = false;
  $('invia').hidden = false;
  $('bNuovo').hidden = false;
  $('ivaBox').scrollIntoView();
}

// tariffe: salvate a parte, restano anche dopo "Nuovo intervento" e alla riapertura
let T = {};
try { T = JSON.parse(localStorage.getItem('tarUscite') || 'null') || {}; } catch (e) {}
$('tKm').value = T.tKm || S.tKm || 1;
$('tOra').value = T.tOra || S.tOra || 40;
$('tOp').value = T.tOp || S.tOp || 30;
['tKm', 'tOra', 'tOp'].forEach(id => {
  $(id).oninput = () => {
    T[id] = +$(id).value;
    try { localStorage.setItem('tarUscite', JSON.stringify(T)); } catch (e) {}
  };
});
$('conOp').checked = !!S.conOp;
opUi();
$('cliente').value = S.cliente || '';
if (S.kmMan > 0) $('kmMan').value = S.kmMan;
$('conIva').checked = !!S.iva;
$('tel').value = S.tel || '';
ui();
</script>
<script>
// salva anche quando l'app va in secondo piano o viene chiusa
addEventListener('pagehide', () => { try { salva(); } catch (e) {} });
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { salva(); } catch (e) {} } });
// copia delle pagine sul telefono (apertura senza rete) e memoria da non cancellare
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
