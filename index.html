<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pialletto d'Oro">
<meta name="theme-color" content="#FAF8F5">
<link rel="apple-touch-icon" href="./logo.png">
<title>Preventivatore Intervento</title>
<style>
:root{--bg:#FAF8F5;--card:#FFFFFF;--fg:#2C221E;--mut:#7A6E66;--line:#EAE3D9;--blu:#C59B27;--ara:#B85D19;--ver:#2E7D32;--dark:#2C221E;--oro:#C59B27}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35;margin:0 auto;max-width:520px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--dark);z-index:5}
header{text-align:center;margin:2px 0 16px}
.logo{width:108px;height:56px;margin:0 auto 10px;overflow:hidden;position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(44,34,30,.05)}
.logo img{position:absolute;top:50%;left:50%;width:140px;height:140px;max-width:none;transform:translate(-50%,-50%)}
.marca{font-size:24px;font-weight:700;letter-spacing:.02em;color:var(--oro);margin-bottom:8px}
h1{font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--fg);margin:0}
h1::after{content:"";display:block;width:48px;height:3px;border-radius:3px;background:var(--oro);margin:9px auto 0}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(44,34,30,.04),0 4px 14px rgba(44,34,30,.06)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input[type=number],input[type=text]{width:100%;min-height:44px;padding:10px 12px;font-size:17px;font-family:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);-webkit-appearance:none;appearance:none}
input[type=number]:focus,input[type=text]:focus{outline:2px solid var(--blu);outline-offset:0;border-color:transparent}

/* stato */
#stato{display:block;width:fit-content;margin:0 auto 14px;padding:8px 18px;border-radius:999px;background:#FBF5E4;color:#2C221E;border:1.5px solid var(--oro);font-size:16px;font-weight:700;text-align:center}

/* pulsanti principali */
button{display:block;width:100%;min-height:68px;padding:16px;font-family:inherit;font-size:18px;font-weight:700;letter-spacing:.01em;border:0;border-radius:14px;margin-top:12px;cursor:pointer;color:#fff;background:var(--blu);touch-action:manipulation;-webkit-appearance:none;appearance:none;transition:transform .08s,opacity .15s}
#bParti{margin-top:0}
button.b2{background:var(--ara)}
button.b3{background:var(--ver)}
button:active:not(:disabled){transform:scale(.98);opacity:.85}
button:disabled{opacity:.3;cursor:default}
.note{font-size:14px;color:var(--mut);line-height:1.45;margin-top:10px;text-align:center}
#live:empty{display:none}

/* switch iOS */
.chk{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.chk label{order:-1;flex:1;margin:0;font-size:17px;color:var(--fg);padding:6px 0}
.chk input{flex:none;width:51px;height:31px;margin:0;border-radius:31px;background:#E9E9EA;position:relative;cursor:pointer;-webkit-appearance:none;appearance:none;transition:background .2s}
.chk input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.chk input:checked{background:var(--ver)}
.chk input:checked::after{transform:translateX(20px)}

/* menu espandibili */
details{border-top:1px solid var(--line);margin-top:14px}
summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding-top:4px;font-size:16px;color:#8A6A12;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:9px;height:9px;margin:0 4px 0 10px;border-right:2px solid #CFC4B4;border-bottom:2px solid #CFC4B4;transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
details label{margin-top:4px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:4px}
.row>div{min-width:0}
.row label{margin-top:0;white-space:nowrap;font-size:12px}

/* risultato */
#res{background:var(--dark);border-color:var(--dark);color:#FAF8F5;box-shadow:0 6px 20px rgba(44,34,30,.25)}
#res .note{color:#EFE6D6;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tot{color:#E5B84B;font-size:46px;font-weight:700;letter-spacing:-.02em;text-align:center;margin:6px 0 14px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 0;border-top:1px solid #4A3C35;vertical-align:top}
td:first-child{color:#CFC4B4;padding-right:10px}
td:last-child{text-align:right}
button.ghost{min-height:48px;margin-top:16px;padding:12px;font-size:16px;font-weight:600;background:transparent;color:#FAF8F5;border:1px solid #6B5A50}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo"><img src="./logo.png" alt="Pialletto d'Oro" onerror="this.parentNode.hidden=true;this.parentNode.nextElementSibling.hidden=false"></div>
  <div class="marca" hidden>Pialletto d'Oro</div>
  <h1>Preventivatore Intervento</h1>
</header>

<section>
  <div id="stato">Pronto.</div>
  <button id="bParti">1. PARTO</button>
  <button class="b2" id="bArrivo" disabled>2. SONO ARRIVATO</button>
  <button class="b3" id="bFine" disabled>3. HO FINITO</button>
  <div class="note" id="live"></div>
</section>

<section>
  <div class="chk"><input type="checkbox" id="conOp"><label for="conOp">Vado con un operaio</label></div>
  <label for="cliente">Cliente</label>
  <input type="text" id="cliente" placeholder="Nome cliente">

  <details>
    <summary>Inserisci km a mano se il GPS non prende</summary>
    <label for="kmMan">Km di sola andata (solo se il GPS non funziona)</label>
    <input type="number" id="kmMan" step="0.1" placeholder="es. 12" inputmode="decimal">
  </details>

  <details>
    <summary>Impostazioni tariffe</summary>
    <div class="row">
      <div><label for="tKm">€ al km</label><input type="number" id="tKm" value="1" step="0.1" inputmode="decimal"></div>
      <div><label for="tOra">€/ora tu</label><input type="number" id="tOra" value="40" inputmode="decimal"></div>
      <div><label for="tOp">€/ora operaio</label><input type="number" id="tOp" value="30" inputmode="decimal"></div>
    </div>
  </details>
</section>

<section id="res" hidden>
  <div class="note" style="margin:0">Da chiedere al cliente</div>
  <div class="tot" id="tot">0 €</div>
  <table id="dett"></table>
  <button class="ghost" id="bNuovo">Nuovo intervento</button>
</section>

<script>
const $ = id => document.getElementById(id);
let S = { fase: 0 };
try { S = JSON.parse(localStorage.getItem('prev') || 'null') || { fase: 0 }; } catch (e) {}
function salva() { try { localStorage.setItem('prev', JSON.stringify(S)); } catch (e) {} }

function dist(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dl = r(b.lat - a.lat), dn = r(b.lon - a.lon);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dn / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function pos() {
  return new Promise(ok => {
    if (!navigator.geolocation) { ok(null); return; }
    try {
      navigator.geolocation.getCurrentPosition(
        p => ok({ lat: p.coords.latitude, lon: p.coords.longitude }),
        () => ok(null),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    } catch (e) { ok(null); }
  });
}

const fmt = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; };
const eur = n => n.toFixed(2).replace('.', ',') + ' €';

function ui() {
  $('bParti').disabled = S.fase !== 0;
  $('bArrivo').disabled = S.fase !== 1;
  $('bFine').disabled = S.fase !== 2;
  $('stato').textContent = ['Pronto.', 'In viaggio...', 'Al lavoro...', 'Finito.'][S.fase];
  if (S.fase === 3) mostra();
}

$('bParti').onclick = async () => {
  $('stato').textContent = 'Rilevo posizione...';
  S.p0 = await pos();
  S.t0 = Date.now();
  S.fase = 1;
  salva(); ui();
  $('live').textContent = S.p0 ? 'Posizione di partenza rilevata.' : 'GPS non disponibile: scrivi i km di sola andata.';
};

$('bArrivo').onclick = async () => {
  $('stato').textContent = 'Rilevo posizione...';
  S.p1 = await pos();
  S.t1 = Date.now();
  S.fase = 2;
  salva(); ui();
  $('live').textContent = S.p1 ? 'Posizione di arrivo rilevata.' : 'GPS non disponibile: scrivi i km di sola andata.';
};

$('bFine').onclick = () => {
  S.t2 = Date.now();
  S.fase = 3;
  S.tKm = +$('tKm').value;
  S.tOra = +$('tOra').value;
  S.tOp = +$('tOp').value;
  S.conOp = $('conOp').checked;
  S.cliente = $('cliente').value;
  S.kmMan = parseFloat($('kmMan').value);
  salva(); ui();
};

$('bNuovo').onclick = () => {
  S = { fase: 0 };
  salva();
  $('res').hidden = true;
  $('live').textContent = '';
  $('kmMan').value = '';
  ui();
};

function mostra() {
  let kmUno = 0, fonte = 'mancanti';
  if (S.kmMan > 0) { kmUno = S.kmMan; fonte = 'inseriti da te'; }
  else if (S.p0 && S.p1) { kmUno = dist(S.p0, S.p1) * 1.25; fonte = 'stimati dal GPS'; }

  const km = kmUno * 2;                                   // andata e ritorno
  const ore = (S.t2 - S.t1) / 3600000;                    // tempo al lavoro
  const oreC = Math.max(0.25, Math.ceil(ore * 4) / 4);    // arrotondato al quarto d'ora
  const cKm = km * S.tKm;
  const cL = oreC * S.tOra;
  const cO = S.conOp ? oreC * S.tOp : 0;

  $('tot').textContent = eur(cKm + cL + cO);

  const t = $('dett');
  t.innerHTML = '';
  const riga = (a, b) => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td');
    const td2 = document.createElement('td');
    td1.textContent = a; td2.textContent = b;
    tr.appendChild(td1); tr.appendChild(td2);
    t.appendChild(tr);
  };
  if (S.cliente) riga('Cliente', S.cliente);
  riga('Km andata+ritorno (' + fonte + ')', km.toFixed(1) + ' km · ' + eur(cKm));
  riga('Tempo al lavoro', fmt(S.t2 - S.t1) + ' (conteggiate ' + oreC.toFixed(2) + ' h)');
  riga('Manodopera tua', eur(cL));
  if (S.conOp) riga('Operaio', eur(cO));
  $('res').hidden = false;
  $('res').scrollIntoView();
}

$('tKm').value = S.tKm || 1;
$('tOra').value = S.tOra || 40;
$('tOp').value = S.tOp || 30;
$('conOp').checked = !!S.conOp;
$('cliente').value = S.cliente || '';
if (S.kmMan > 0) $('kmMan').value = S.kmMan;
ui();
</script>
</body>
</html>
